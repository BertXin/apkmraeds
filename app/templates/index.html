<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APK 分发系统</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container { max-width: 520px; width: 100%; }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header h1 {
            color: white;
            font-size: 28px;
            font-weight: 600;
        }
        .header p {
            color: rgba(255,255,255,0.8);
            margin-top: 8px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .nav-links {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }
        .nav-links a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 8px;
            background: #f0f4ff;
            transition: all 0.2s;
        }
        .nav-links a:hover {
            background: #667eea;
            color: white;
        }
        .drop-zone {
            border: 2px dashed #ddd;
            border-radius: 12px;
            padding: 48px 24px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
            background: #fafafa;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: #667eea;
            background: #f0f4ff;
        }
        .drop-zone-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            background: #667eea;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .drop-zone-icon svg {
            width: 32px;
            height: 32px;
            fill: white;
        }
        .drop-zone-text {
            color: #666;
            font-size: 15px;
            line-height: 1.6;
        }
        .drop-zone-text span {
            color: #667eea;
            font-weight: 500;
        }
        .file-info {
            display: none;
            padding: 16px;
            background: #f0f4ff;
            border-radius: 8px;
            margin-top: 16px;
        }
        .file-info.show { display: flex; align-items: center; gap: 12px; }
        .file-info .name { color: #333; font-weight: 500; }
        .file-info .size { color: #888; font-size: 13px; }
        .file-info .remove {
            color: #e53935;
            cursor: pointer;
            margin-left: auto;
            font-size: 20px;
        }
        .input-group { margin-top: 20px; }
        .input-group label {
            display: block;
            color: #333;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            margin-top: 24px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102,126,234,0.4);
        }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .progress {
            margin-top: 24px;
            display: none;
        }
        .progress-bar {
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
        }
        .progress-text {
            text-align: center;
            margin-top: 12px;
            color: #666;
            font-size: 14px;
        }
        /* 弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 32px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            background: #4caf50;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-icon svg { width: 32px; height: 32px; fill: white; }
        .modal-icon.error { background: #e53935; }
        .modal h2 { color: #333; font-size: 20px; margin-bottom: 8px; }
        .modal p { color: #666; font-size: 14px; margin-bottom: 20px; }
        .modal-link {
            background: #f5f5f5;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            word-break: break-all;
            font-size: 13px;
            color: #667eea;
        }
        .modal-btns { display: flex; gap: 12px; }
        .modal-btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .modal-btn.primary {
            background: #667eea;
            color: white;
            border: none;
        }
        .modal-btn.secondary {
            background: white;
            color: #333;
            border: 1px solid #ddd;
        }
        .modal-btn:hover { opacity: 0.9; }
        .copy-toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        .copy-toast.show { display: block; animation: toastIn 0.3s ease; }
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>APK 分发系统</h1>
            <p>上传 APK 文件，生成下载链接</p>
        </div>
        <div class="card">
            <div class="nav-links">
                <a href="/">上传文件</a>
                <a href="/list">文件列表</a>
            </div>
            <div class="drop-zone" id="dropZone">
                <div class="drop-zone-icon">
                    <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                </div>
                <div class="drop-zone-text">
                    拖拽 APK 文件到这里<br>或 <span>点击选择文件</span>
                </div>
                <input type="file" id="fileInput" accept=".apk" hidden>
            </div>
            <div class="file-info" id="fileInfo">
                <span class="name" id="fileName"></span>
                <span class="size" id="fileSize"></span>
                <span class="remove" id="removeFile">×</span>
            </div>
            <div class="input-group">
                <label>上传 Token</label>
                <input type="password" id="tokenInput" placeholder="请输入上传 Token">
            </div>
            <button class="btn" id="uploadBtn" disabled>开始上传</button>
            <div class="progress" id="progress">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText">准备上传...</div>
            </div>
        </div>
    </div>

    <!-- 成功弹窗 -->
    <div class="modal" id="successModal">
        <div class="modal-content">
            <div class="modal-icon">
                <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
            </div>
            <h2>上传成功</h2>
            <p>APK 文件已上传，点击复制链接分享给测试人员</p>
            <div class="modal-link" id="modalLink"></div>
            <div class="modal-btns">
                <button class="modal-btn primary" id="copyBtn">复制链接</button>
                <button class="modal-btn secondary" id="downloadBtn">下载测试</button>
            </div>
        </div>
    </div>

    <!-- 失败弹窗 -->
    <div class="modal" id="errorModal">
        <div class="modal-content">
            <div class="modal-icon error">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            </div>
            <h2>上传失败</h2>
            <p id="errorMsg"></p>
            <div class="modal-btns">
                <button class="modal-btn primary" id="retryBtn">重新上传</button>
            </div>
        </div>
    </div>

    <!-- 复制提示 -->
    <div class="copy-toast" id="copyToast">链接已复制到剪贴板</div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const removeFile = document.getElementById('removeFile');
        const tokenInput = document.getElementById('tokenInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const progress = document.getElementById('progress');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const successModal = document.getElementById('successModal');
        const errorModal = document.getElementById('errorModal');
        const modalLink = document.getElementById('modalLink');
        const errorMsg = document.getElementById('errorMsg');
        const copyBtn = document.getElementById('copyBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const retryBtn = document.getElementById('retryBtn');
        const copyToast = document.getElementById('copyToast');

        let selectedFile = null;
        let downloadUrl = null;

        // 格式化文件大小
        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1024 / 1024).toFixed(1) + ' MB';
        }

        // 显示文件信息
        function showFileInfo(file) {
            fileName.textContent = file.name;
            fileSize.textContent = formatSize(file.size);
            fileInfo.classList.add('show');
            dropZone.style.display = 'none';
            updateUploadBtn();
        }

        // 隐藏文件信息
        function hideFileInfo() {
            selectedFile = null;
            fileInfo.classList.remove('show');
            dropZone.style.display = 'block';
            updateUploadBtn();
        }

        // 更新上传按钮状态
        function updateUploadBtn() {
            uploadBtn.disabled = !selectedFile || !tokenInput.value;
        }

        // 点击选择文件
        dropZone.addEventListener('click', () => fileInput.click());

        // 拖拽效果
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

        // 拖拽放置
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length && files[0].name.toLowerCase().endsWith('.apk')) {
                selectedFile = files[0];
                showFileInfo(selectedFile);
            }
        });

        // 文件选择
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                selectedFile = e.target.files[0];
                showFileInfo(selectedFile);
            }
        });

        // 移除文件
        removeFile.addEventListener('click', hideFileInfo);

        // Token 输入
        tokenInput.addEventListener('input', updateUploadBtn);

        // 上传
        uploadBtn.addEventListener('click', () => {
            if (!selectedFile || !tokenInput.value) return;

            uploadBtn.disabled = true;
            progress.style.display = 'block';
            progressFill.style.width = '0%';
            progressText.textContent = '上传中...';

            const formData = new FormData();
            formData.append('file', selectedFile);

            const xhr = new XMLHttpRequest();

            xhr.upload.addEventListener('progress', (e) => {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    progressFill.style.width = percent + '%';
                    progressText.textContent = `上传中 ${percent}%`;
                }
            });

            xhr.addEventListener('load', () => {
                progress.style.display = 'none';
                if (xhr.status === 200) {
                    const data = JSON.parse(xhr.responseText);
                    downloadUrl = data.download_url;
                    modalLink.textContent = downloadUrl;
                    successModal.classList.add('show');
                } else {
                    const data = JSON.parse(xhr.responseText);
                    errorMsg.textContent = data.detail || '上传失败，请重试';
                    errorModal.classList.add('show');
                }
                uploadBtn.disabled = false;
            });

            xhr.addEventListener('error', () => {
                progress.style.display = 'none';
                errorMsg.textContent = '网络连接失败，请检查网络后重试';
                errorModal.classList.add('show');
                uploadBtn.disabled = false;
            });

            xhr.addEventListener('abort', () => {
                progress.style.display = 'none';
                errorMsg.textContent = '上传已取消';
                errorModal.classList.add('show');
                uploadBtn.disabled = false;
            });

            xhr.open('POST', '/api/upload');
            xhr.setRequestHeader('Authorization', 'Bearer ' + tokenInput.value);
            xhr.send(formData);
        });

        // 复制链接
        copyBtn.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(downloadUrl);
                copyToast.classList.add('show');
                setTimeout(() => copyToast.classList.remove('show'), 2000);
            } catch (e) {
                // 兼容旧浏览器
                const textarea = document.createElement('textarea');
                textarea.value = downloadUrl;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                copyToast.classList.add('show');
                setTimeout(() => copyToast.classList.remove('show'), 2000);
            }
        });

        // 下载测试
        downloadBtn.addEventListener('click', () => {
            if (downloadUrl) window.open(downloadUrl, '_blank');
        });

        // 关闭成功弹窗
        successModal.addEventListener('click', (e) => {
            if (e.target === successModal) successModal.classList.remove('show');
        });

        // 关闭失败弹窗并重试
        retryBtn.addEventListener('click', () => {
            errorModal.classList.remove('show');
            hideFileInfo();
        });
        errorModal.addEventListener('click', (e) => {
            if (e.target === errorModal) errorModal.classList.remove('show');
        });
    </script>
</body>
</html>
