services:
  apk-server:
    build: .
    container_name: apk-distribute
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data          # 数据库持久化
      - ./.env:/app/.env:ro       # 配置文件
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3